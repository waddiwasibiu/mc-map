<header class="fixed top-0 left-0 right-0 z-40 transition-all duration-300 py-3" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(59,130,246,0.12);">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20">
                    <i class="fa fa-map-o text-white text-lg"></i>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-dark to-primary bg-clip-text text-transparent">Baka村 <span class="text-primary">结构坐标</span></h1>
            </div>
            
            <nav class="hidden md:flex space-x-1">
                <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-primary hover:bg-primary/5 transition-all">结构坐标库</a>
                <a href="posts.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-primary hover:bg-primary/5 transition-all">帖子库</a>
                <a href="#comments" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-primary hover:bg-primary/5 transition-all">评论区</a>
            </nav>
            
            <div class="flex items-center space-x-3">
                <div class="relative hidden sm:block">
                    <input type="text" id="searchInput" placeholder="搜索结构或坐标..." class="pl-10 pr-4 py-2 w-56 rounded-xl border border-gray-200 bg-gray-50/80 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all text-sm">
                    <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                </div>
                
                <button class="md:hidden w-9 h-9 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors" id="mobileMenuBtn">
                    <i class="fa fa-bars text-lg"></i>
                </button>
            </div>
            
        </div>
        
        <!-- 移动端菜单 -->
        <div id="mobileMenu" class="hidden md:hidden mt-3 pb-2 space-y-1">
            <a href="index.html" class="block px-4 py-2.5 rounded-lg text-gray-600 hover:text-primary hover:bg-primary/5 transition-all text-sm font-medium">结构坐标库</a>
            <a href="posts.html" class="block px-4 py-2.5 rounded-lg text-gray-600 hover:text-primary hover:bg-primary/5 transition-all text-sm font-medium">帖子库</a>
            <a href="#comments" class="block px-4 py-2.5 rounded-lg text-gray-600 hover:text-primary hover:bg-primary/5 transition-all text-sm font-medium">评论区</a>
        </div>
    </div>
</header>
